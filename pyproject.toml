[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-dft-route"
version = "0.1.0"
description = "DeepDFT-Route: Multimodal Neural Prediction of DFT-Induced Physical Routing Congestion"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
    {name = "Nithin P B", email = "pbnitin3@gmail.com"}
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]
ml = [
    "xgboost>=1.6.0",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
